# Runs on every PR and every push to main. The `check` job mirrors local
# `pnpm check` (lint, typecheck, unit + api + fakes + e2e tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: test (unit + api + fakes + e2e)
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore

  compose:
    name: docker compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://127.0.0.1:8090/api/health
      - name: backup and restore into a second project
        run: |
          scripts/backup.sh backups/ci.tar.gz
          COMPOSE_PROJECT_NAME=dida-restore APP_PORT=8091 scripts/restore.sh backups/ci.tar.gz --yes
          curl -fsS http://127.0.0.1:8091/api/health
      - name: attachments survive backup and restore (upload, backup, restore, download, compare)
        run: scripts/backup-restore-smoke.sh
      - if: failure()
        run: docker compose logs
